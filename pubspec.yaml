name: voyage
description: Atelier 3 - Pages Authentification & Inscription avec shared_preferences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  sqflite: ^2.4.5
  path: ^1.9.1
  http: ^1.6.0
  intl: ^0.20.3
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  snippet_coder_utils: ^1.0.15
  sqflite_common_ffi_web: ^1.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  google_mlkit_translation: ^0.11.0
  google_mlkit_language_id: ^0.11.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - images/profile.png
    - images/meteo.png
    - images/gallerie.png
    - images/pays.png
    - images/contact.png
    - images/parametres.png
    - images/deconnexion.png
    - images/clear.png
    - images/clouds.png
    - images/snow.png
    - images/rain.png
    - images/traduction.png
